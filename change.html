<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .container {
            width: 500px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .form-container {
            margin-top: 20px;
        }

        #amountInput {
            padding: 8px;
            font-size: 16px;
            width: 150px;
        }

        #submitBtn {
            padding: 8px 12px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            text-align: left;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Assignment</h1>
        <div class="form-container">
            <h2>Calculate Change</h2>
            <form id="changeForm">
                <label for="amountInput">Enter Amount: </label>
                <input type="number" id="amountInput" name="amount" required>
                <button type="submit" id="submitBtn">Submit</button>
            </form>
            <div id="result">
                </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
