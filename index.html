                }, 1000);

            // --- Step 2: Generate Category Cards with Emojis ---
            function renderCategories() {
                categoryList.innerHTML = '';
                Object.keys(foodData).forEach(category => {
                    const card = document.createElement('div');
                    card.classList.add('bg-lime-50', 'rounded-xl', 'p-4', 'shadow-sm', 'hover:bg-lime-100', 'transition-colors', 'cursor-pointer', 'text-center', 'font-semibold', 'text-lg', 'text-lime-800');
                    card.textContent = category;
                    card.dataset.category = category;
                    categoryList.appendChild(card);
                });
            }

            // --- Step 3: Handle Category Clicks to Show Pairings ---
            categoryList.addEventListener('click', (event) => {
                const categoryCard = event.target.closest('div');
                if (categoryCard && categoryCard.dataset.category) {
                    const categoryName = categoryCard.dataset.category;
                    renderPairings(categoryName);
                }
            });

            function renderPairings(categoryName) {
                currentCategoryTitle.textContent = categoryName;
                pairingsList.innerHTML = '';

                foodData[categoryName].forEach(item => {
                    const listItem = document.createElement('li');
                    listItem.classList.add('bg-gray-50', 'rounded-xl', 'p-4', 'shadow-sm');

                    const title = document.createElement('h3');
                    title.classList.add('font-bold', 'text-gray-900', 'text-xl', 'mb-2');
                    title.textContent = item.name;

                    const pairingsText = document.createElement('p');
                    pairingsText.classList.add('text-gray-600');
                    // The description for "Healthy Habits" and new categories is different
                    if (["Healthy Habits 🌱", "Superfoods ✨", "Energy Boosts ⚡", "Vitamins & Minerals 💊"].includes(categoryName)) {
                        pairingsText.textContent = item.pairings.join(', ');
                    } else {
                        pairingsText.textContent = `Pairs with: ${item.pairings.join(', ')}.`;
                    }

                    listItem.appendChild(title);
                    listItem.appendChild(pairingsText);
                    pairingsList.appendChild(listItem);
                });

                categoryView.classList.add('hidden');
                pairingsView.classList.remove('hidden');
            }

            // --- Step 4: Handle Back Button Click ---
            backButton.addEventListener('click', () => {
                pairingsView.classList.add('hidden');
                categoryView.classList.remove('hidden');
                displayRandomPhrase(); // Show a new phrase when returning to the category view
            });
            
            // --- Step 5: Display a random food phrase ---
            function displayRandomPhrase() {
                const randomIndex = Math.floor(Math.random() * foodPhrases.length);
                foodPhraseElement.textContent = foodPhrases[randomIndex];
            }

            // Initial render
            renderCategories();
        });
